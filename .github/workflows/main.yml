name: build
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".node-version"
      - ".env*"
      - "src/**"
      - "public/**"
      - "test/**"
      - "Dockerfile"
      - ".dockerignore"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/main.yml"
  pull_request:
    branches:
      - master
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".node-version"
      - ".env*"
      - "src/**"
      - "public/**"
      - "test/**"
      - "Dockerfile"
      - ".dockerignore"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/main.yml"
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'sub-store-org/Sub-Store-Front-End'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: "master"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile
      - name: build
        run: |
          pnpm build
      - uses: amondnet/vercel-action@v42 #deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }} # Required
          # github-token: ${{ secrets.GITHUB_TOKEN }} # Optional
          vercel-args: "--prod --debug" # Optional
          vercel-org-id: ${{ secrets.ORG_ID}} # Required
          vercel-project-id: ${{ secrets.PROJECT_ID}} # Required
          working-directory: dist
          vercel-version: "48.9.0"
      - name: zip
        run: |
          zip -r dist.zip dist
      - id: tag
        name: Generate release tag
        run: |
          SUB_STORE_RELEASE="$(node --eval='process.stdout.write(require("./package.json").version)')"
          echo "release_tag=$SUB_STORE_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Prepare release
        run: |
          pnpm i -D conventional-changelog-cli
          pnpm run changelog
      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: ./CHANGELOG.md
          tag_name: ${{ steps.tag.outputs.release_tag }}
          # generate_release_notes: true
          files: |
            dist.zip

  source-image:
    if: github.repository != 'sub-store-org/Sub-Store-Front-End'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up isolated builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Test and build source image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
